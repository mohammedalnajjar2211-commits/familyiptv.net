<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Player | IPTV Web Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
<style>
:root{--red:#d40000;--bg:#090909;--panel:#141414;--panel2:#1d1d1d;--txt:#fff;--muted:#aaa;--line:#2a2a2a;--ok:#20c997}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:radial-gradient(circle at top right,#260000 0,#090909 35%);color:var(--txt);min-height:100vh}
button,input,select{font:inherit}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:rgba(18,18,18,.9);border:1px solid #2f2f2f;border-radius:28px;padding:32px;box-shadow:0 30px 80px #0008;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:10px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#ff3131,var(--red));display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 12px 35px #d4000040}.brand h1{margin:0;font-size:28px}.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 26px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:#ddd;margin-bottom:7px}.field input,.field select{width:100%;padding:14px 15px;border-radius:14px;border:1px solid #303030;background:#0d0d0d;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px #d4000026}
.btn{border:0;border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:800}.btn-primary{width:100%;background:linear-gradient(135deg,#f21b1b,#a90000);color:#fff;box-shadow:0 10px 30px #d4000038}.status{margin-top:12px;min-height:24px;font-size:13px;color:#ff8b8b;text-align:center}
.demo{margin-top:18px;padding:13px;border:1px solid #2d2d2d;background:#101010;border-radius:14px;font-size:12px;color:#bbb;line-height:1.9}.demo b{color:#fff}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090909e8;backdrop-filter:blur(16px);border-bottom:1px solid #222}.mini-brand{display:flex;align-items:center;gap:10px}.mini-logo{width:38px;height:38px;border-radius:12px;background:var(--red);display:grid;place-items:center;font-weight:900}.actions{display:flex;gap:8px}.iconbtn{background:#151515;border:1px solid #292929;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.sidebar{border-left:1px solid #222;background:#0b0b0b;padding:20px 14px}.navbtn{width:100%;display:flex;gap:10px;align-items:center;background:transparent;color:#ccc;border:0;padding:13px 14px;border-radius:13px;cursor:pointer;margin:3px 0;text-align:right}.navbtn.active,.navbtn:hover{background:#211010;color:#fff}.content{padding:24px;min-width:0}.hero{background:linear-gradient(135deg,#300000,#111);border:1px solid #351515;border-radius:24px;padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#bbb}.pill{padding:9px 12px;border-radius:999px;background:#15291f;color:#9ef0c8;border:1px solid #24553d;font-size:12px;white-space:nowrap}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section-title h3{margin:0;font-size:20px}.search{width:min(340px,100%);padding:11px 14px;border-radius:12px;border:1px solid #2b2b2b;background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.card{background:#121212;border:1px solid #242424;border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#4c2020}.poster{aspect-ratio:2/3;background:#1d1d1d;display:grid;place-items:center;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.poster .ph{font-size:38px;color:#777}.meta{padding:11px}.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:11px;color:#8f8f8f;margin-top:4px}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.cat{padding:20px;border-radius:18px;background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #292929;cursor:pointer}.cat strong{display:block;margin-bottom:5px}.cat span{font-size:12px;color:#999}
.player-modal{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:24px}.player-box{width:min(1100px,100%);background:#101010;border:1px solid #2b2b2b;border-radius:18px;overflow:hidden}.player-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.player-head h4{margin:0}.player-box video{width:100%;max-height:72vh;background:#000;display:block}.close{background:#251010;color:#fff;border:1px solid #4e1d1d;border-radius:10px;padding:8px 12px;cursor:pointer}
.empty{padding:40px;text-align:center;color:#888;border:1px dashed #333;border-radius:18px}.spinner{width:34px;height:34px;border:4px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;bottom:0;left:0;right:0;z-index:30;border:0;border-top:1px solid #222;padding:7px;background:#0b0b0bf5;display:grid;grid-template-columns:repeat(4,1fr)}.navbtn{justify-content:center;font-size:12px;padding:10px 5px}.navbtn .label{display:none}.content{padding:16px 16px 90px}.grid{grid-template-columns:repeat(3,1fr)}.category-grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.topbar{padding:0 15px}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:22px}.login-card{padding:23px}}
</style>
</head>
<body>
<section id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="logo">F</div><h1>Family Player</h1></div>
    <p class="sub">مشغل فاملي — Live TV • Movies • Series</p>
    <div class="field"><label>اختر السيرفر</label><select id="dnsSelect"><option value="uae">Family Server UAE</option></select></div>
    <div class="field"><label>اسم المستخدم</label><input id="username" value="29542719927199" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" value="83016608822180" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn btn-primary">تسجيل الدخول</button>
    <div id="loginStatus" class="status"></div>
    <div class="demo"><b>Family Multi DNS</b><br>اختر السيرفر ثم أدخل اسم المستخدم وكلمة المرور. يتم الاتصال عبر بوابة Family الآمنة.</div>
  </div>
</section>

<section id="appView" class="app hidden">
  <header class="topbar"><div class="mini-brand"><div class="mini-logo">F</div><strong>Family Player</strong></div><div class="actions"><button id="refreshBtn" class="iconbtn">↻ تحديث</button><button id="logoutBtn" class="iconbtn">خروج</button></div></header>
  <div class="shell">
    <aside class="sidebar">
      <button class="navbtn active" data-section="home">🏠 <span class="label">الرئيسية</span></button>
      <button class="navbtn" data-section="live">📺 <span class="label">البث المباشر</span></button>
      <button class="navbtn" data-section="movies">🎬 <span class="label">الأفلام</span></button>
      <button class="navbtn" data-section="series">📚 <span class="label">المسلسلات</span></button>
    </aside>
    <main id="content" class="content"></main>
  </div>
</section>

<div id="playerModal" class="player-modal hidden"><div class="player-box"><div class="player-head"><h4 id="playerTitle">Family Player</h4><button id="closePlayer" class="close">إغلاق ✕</button></div><video id="video" controls playsinline></video></div></div>

<script>
const PROXY_BASE='https://api.mohammedalnajjar2211.workers.dev';
const DNS_LIST=[
  {id:'uae',name:'Family Server UAE'}
  // لإضافة DNS جديد: أضفه أولاً داخل SERVERS في Cloudflare Worker
  // ثم أضف هنا مثلاً: {id:'iraq',name:'Family Server Iraq'}
];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let session={serverId:'',serverName:'',username:'',password:'',auth:null};
let cache={liveCats:null,movieCats:null,seriesCats:null};

function proxyPath(path=''){return `${PROXY_BASE}/p/${encodeURIComponent(session.serverId)}/${String(path).replace(/^\/+/, '')}`}
function api(action='',extra={}){
  const p=new URLSearchParams({username:session.username,password:session.password,...extra});
  if(action)p.set('action',action);
  return `${proxyPath('player_api.php')}?${p.toString()}`;
}
async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function poster(src,title){return src?`<img loading="lazy" src="${escapeHtml(src)}" alt="${escapeHtml(title)}" onerror="this.parentElement.innerHTML='<div class=ph>▶</div>'">`:`<div class="ph">▶</div>`}
function showLoading(msg='جاري التحميل...'){$('#content').innerHTML=`<div class="empty"><div class="spinner"></div>${msg}</div>`}
function expDate(ts){if(!ts||ts==='0')return 'غير محدد';return new Date(Number(ts)*1000).toLocaleDateString('ar')}

async function login(){
 const btn=$('#loginBtn'),st=$('#loginStatus'); btn.disabled=true;st.textContent='جاري التحقق من الحساب...';
 session.serverId=$('#dnsSelect').value;session.serverName=DNS_LIST.find(d=>d.id===session.serverId)?.name||'Family Server';session.username=$('#username').value.trim();session.password=$('#password').value.trim();
 try{const data=await getJSON(api());if(!data.user_info||String(data.user_info.auth)!=='1')throw new Error('بيانات الدخول غير صحيحة');session.auth=data;localStorage.setItem('familyPlayerSession',JSON.stringify({serverId:session.serverId,username:session.username}));$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderHome();}
 catch(e){st.textContent='تعذر تسجيل الدخول. تحقق من اسم المستخدم وكلمة المرور أو حالة السيرفر.';console.error(e)}finally{btn.disabled=false}
}

function renderHome(){
 const u=session.auth?.user_info||{};
 $('#content').innerHTML=`<section class="hero"><div><h2>مرحباً بك في Family Player</h2><p>تم الاتصال بنجاح. اختر البث المباشر أو الأفلام أو المسلسلات.</p></div><span class="pill">● الحساب ${u.status||'Active'}</span></section>
 <div class="section-title"><h3>معلومات الاشتراك</h3></div>
 <div class="category-grid"><div class="cat"><strong>اسم المستخدم</strong><span>${escapeHtml(u.username||session.username)}</span></div><div class="cat"><strong>تاريخ الانتهاء</strong><span>${expDate(u.exp_date)}</span></div><div class="cat"><strong>الاتصالات</strong><span>${escapeHtml(u.active_cons||'0')} / ${escapeHtml(u.max_connections||'1')}</span></div><div class="cat"><strong>السيرفر</strong><span>${escapeHtml(session.serverName)}</span></div></div>
 <div class="section-title"><h3>الأقسام</h3></div><div class="category-grid"><div class="cat" onclick="loadSection('live')"><strong>📺 البث المباشر</strong><span>القنوات والتصنيفات</span></div><div class="cat" onclick="loadSection('movies')"><strong>🎬 الأفلام</strong><span>مكتبة VOD</span></div><div class="cat" onclick="loadSection('series')"><strong>📚 المسلسلات</strong><span>المواسم والحلقات</span></div><div class="cat" onclick="renderHome()"><strong>⭐ المفضلة</strong><span>يمكن توسيعها لاحقاً</span></div></div>`;
}

async function categories(type){const map={live:'get_live_categories',movies:'get_vod_categories',series:'get_series_categories'};if(cache[type+'Cats'])return cache[type+'Cats'];return cache[type+'Cats']=await getJSON(api(map[type]));}
async function streams(type,categoryId){const map={live:'get_live_streams',movies:'get_vod_streams',series:'get_series'};return getJSON(api(map[type],categoryId?{category_id:categoryId}:{}))}

async function loadSection(type){
 $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.section===type));showLoading();
 try{const cats=await categories(type);const label={live:'البث المباشر',movies:'الأفلام',series:'المسلسلات'}[type];$('#content').innerHTML=`<div class="section-title"><h3>${label}</h3><input id="searchInput" class="search" placeholder="بحث..."></div><div id="cats" class="category-grid"></div><div id="itemsWrap"></div>`;const c=$('#cats');c.innerHTML=`<div class="cat" data-id=""><strong>الكل</strong><span>عرض جميع العناصر</span></div>`+cats.map(x=>`<div class="cat" data-id="${escapeHtml(x.category_id)}"><strong>${escapeHtml(x.category_name)}</strong><span>فتح التصنيف</span></div>`).join('');c.querySelectorAll('.cat').forEach(el=>el.onclick=()=>loadItems(type,el.dataset.id));$('#searchInput').oninput=e=>filterCards(e.target.value);await loadItems(type,'');}
 catch(e){$('#content').innerHTML=`<div class="empty">تعذر تحميل البيانات من السيرفر.<br><small>${escapeHtml(e.message)}</small></div>`}
}

async function loadItems(type,cat){const wrap=$('#itemsWrap');wrap.innerHTML='<div class="spinner"></div>';try{const data=await streams(type,cat);if(!Array.isArray(data)||!data.length){wrap.innerHTML='<div class="empty">لا توجد عناصر في هذا القسم</div>';return}wrap.innerHTML=`<div class="section-title"><h3>المحتوى</h3><span class="small">${data.length} عنصر</span></div><div class="grid" id="itemsGrid">${data.map(x=>itemCard(type,x)).join('')}</div>`;wrap.querySelectorAll('.card').forEach(card=>card.onclick=()=>openItem(type,card.dataset.id,card.dataset.ext,card.dataset.name));}catch(e){wrap.innerHTML=`<div class="empty">فشل تحميل المحتوى: ${escapeHtml(e.message)}</div>`}}
function itemCard(type,x){const id=type==='series'?x.series_id:x.stream_id;const image=x.stream_icon||x.cover||'';const ext=x.container_extension||(type==='live'?'ts':'mp4');return `<article class="card" data-name="${escapeHtml(x.name||x.title||'')}" data-id="${escapeHtml(id)}" data-ext="${escapeHtml(ext)}"><div class="poster">${poster(image,x.name||x.title)}</div><div class="meta"><div class="name">${escapeHtml(x.name||x.title||'بدون اسم')}</div><div class="small">${type==='live'?'قناة':type==='movies'?'فيلم':'مسلسل'}</div></div></article>`}
function filterCards(q){q=q.trim().toLowerCase();$$('#itemsGrid .card').forEach(c=>c.style.display=c.dataset.name.toLowerCase().includes(q)?'':'none')}

async function openItem(type,id,ext,name){if(type==='series'){return openSeries(id,name)};const folder=type==='live'?'live':'movie';const fallback=type==='live'?(ext||'ts'):(ext||'mp4');const url=proxyPath(`${folder}/${encodeURIComponent(session.username)}/${encodeURIComponent(session.password)}/${id}.${fallback}`);play(url,name,fallback)}
async function openSeries(id,name){showLoading('جاري تحميل تفاصيل المسلسل...');try{const info=await getJSON(api('get_series_info',{series_id:id}));const eps=[];Object.values(info.episodes||{}).forEach(season=>season.forEach(ep=>eps.push(ep)));$('#content').innerHTML=`<div class="section-title"><h3>${escapeHtml(name)}</h3><button class="iconbtn" onclick="loadSection('series')">رجوع</button></div><div class="grid">${eps.map(ep=>`<article class="card" onclick="play(proxyPath('series/${encodeURIComponent(session.username)}/${encodeURIComponent(session.password)}/${ep.id}.${ep.container_extension||'mp4'}'),'${escapeHtml(ep.title||'حلقة')}')"><div class="poster">${poster(ep.info?.movie_image||'',ep.title)}</div><div class="meta"><div class="name">${escapeHtml(ep.title||'حلقة')}</div><div class="small">الموسم ${ep.season||'-'} • الحلقة ${ep.episode_num||'-'}</div></div></article>`).join('')}</div>`}catch(e){$('#content').innerHTML=`<div class="empty">تعذر تحميل الحلقات</div>`}}
function play(url,title){const v=$('#video');$('#playerTitle').textContent=title||'Family Player';$('#playerModal').classList.remove('hidden');if(window.Hls&&Hls.isSupported()&&url.includes('.m3u8')){if(window._hls)window._hls.destroy();window._hls=new Hls({enableWorker:true});window._hls.loadSource(url);window._hls.attachMedia(v)}else{v.src=url}v.play().catch(()=>{})}
function closePlayer(){const v=$('#video');v.pause();v.removeAttribute('src');v.load();if(window._hls){window._hls.destroy();window._hls=null}$('#playerModal').classList.add('hidden')}
function logout(){localStorage.removeItem('familyPlayerSession');location.reload()}

$('#loginBtn').onclick=login;$('#logoutBtn').onclick=logout;$('#refreshBtn').onclick=()=>{cache={liveCats:null,movieCats:null,seriesCats:null};renderHome()};$('#closePlayer').onclick=closePlayer;$$('.navbtn').forEach(b=>b.onclick=()=>b.dataset.section==='home'?renderHome():loadSection(b.dataset.section));

let activeHls=null;
let activeMpegts=null;

function destroyPlayers(){
  try{
    if(activeHls){
      activeHls.destroy();
      activeHls=null;
    }
  }catch(e){}
  try{
    if(activeMpegts){
      activeMpegts.pause();
      activeMpegts.unload();
      activeMpegts.detachMediaElement();
      activeMpegts.destroy();
      activeMpegts=null;
    }
  }catch(e){}
}

function showPlayerError(message){
  const box=document.querySelector('#playerError');
  if(box){
    box.textContent=message;
    box.style.display='block';
  }
  console.error('[Family Player]',message);
}

function play(url,name,ext=''){
  const modal=$('#playerModal');
  const video=$('#video');
  $('#playerTitle').textContent=name||'Family Player';

  let err=$('#playerError');
  if(!err){
    const e=document.createElement('div');
    e.id='playerError';
    e.style.cssText='display:none;margin:10px 20px;padding:12px 14px;border:1px solid rgba(255,50,50,.35);background:rgba(120,0,0,.25);border-radius:10px;color:#ffd7d7;font-size:13px;direction:rtl';
    video.parentElement.insertBefore(e,video);
  }else{
    err.style.display='none';
    err.textContent='';
  }

  destroyPlayers();
  video.pause();
  video.removeAttribute('src');
  video.load();

  modal.classList.add('show');

  const cleanExt=String(ext||url.split('?')[0].split('.').pop()||'').toLowerCase();

  // HLS manifest
  if(cleanExt==='m3u8'){
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=url;
      video.play().catch(()=>{});
      return;
    }

    if(window.Hls && Hls.isSupported()){
      activeHls=new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        backBufferLength:30,
        maxBufferLength:20,
        manifestLoadingTimeOut:15000,
        levelLoadingTimeOut:15000,
        fragLoadingTimeOut:20000
      });

      activeHls.loadSource(url);
      activeHls.attachMedia(video);

      activeHls.on(Hls.Events.MANIFEST_PARSED,()=>{
        video.play().catch(()=>{});
      });

      activeHls.on(Hls.Events.ERROR,(_,data)=>{
        console.error('HLS ERROR',data);
        if(data.fatal){
          showPlayerError(`خطأ HLS: ${data.type || ''} / ${data.details || 'تعذر تشغيل البث'}`);
        }
      });
      return;
    }

    showPlayerError('هذا المتصفح لا يدعم HLS.');
    return;
  }

  // Xtream live streams are commonly MPEG-TS (.ts).
  if(cleanExt==='ts'){
    if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
      try{
        activeMpegts=mpegts.createPlayer(
          {
            type:'mpegts',
            isLive:true,
            url:url
          },
          {
            enableWorker:true,
            enableStashBuffer:false,
            stashInitialSize:128,
            liveBufferLatencyChasing:true,
            liveBufferLatencyMaxLatency:5,
            liveBufferLatencyMinRemain:1
          }
        );

        activeMpegts.attachMediaElement(video);
        activeMpegts.load();

        activeMpegts.on(mpegts.Events.ERROR,(type,detail,info)=>{
          console.error('MPEGTS ERROR',type,detail,info);
          showPlayerError(`خطأ البث: ${detail || type || 'تعذر تشغيل MPEG-TS'}`);
        });

        video.play().catch(()=>{});
        return;
      }catch(e){
        console.error(e);
        showPlayerError('تعذر تهيئة مشغل MPEG-TS.');
        return;
      }
    }

    showPlayerError('المتصفح لا يدعم تشغيل MPEG-TS عبر MSE.');
    return;
  }

  // MP4 and browser-native formats
  video.src=url;
  video.play().catch(e=>{
    console.error(e);
    showPlayerError('تعذر تشغيل هذا التنسيق في المتصفح.');
  });
}
(function init(){
  const sel=$('#dnsSelect');
  sel.innerHTML=DNS_LIST.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
  const old=localStorage.getItem('familyPlayerSession');
  if(old){
    try{
      const o=JSON.parse(old);
      if([...sel.options].some(x=>x.value===o.serverId)) sel.value=o.serverId;
      $('#username').value=o.username||'';
      $('#password').value='';
    }catch{}
  }
})();
</script>
</body>
</html>
