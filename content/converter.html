<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحويل M3U</title><style>body{background:#080808;color:#fff;font-family:Arial;padding:25px}.box{max-width:650px;margin:auto;background:#121212;border:1px solid #422;border-radius:18px;padding:30px}h1{color:#e11}input,button{width:100%;padding:14px;margin:12px 0;background:#181818;color:#fff;border:1px solid #444;border-radius:10px}button{background:#c00;border-color:#e33;font-weight:bold}.note{color:#999;line-height:1.8}</style><div class="box"><h1>تحويل M3U إلى channels.json</h1><p class="note">اختر ملف M3U. التحويل يتم داخل المتصفح ولا يتم رفع الملف إلى أي خادم.</p><input id="f" type="file" accept=".m3u,.m3u8,.txt"><button onclick="go()">تحويل وتنزيل channels.json</button><p id="r"></p></div><script>function a(s,k){let m=s.match(new RegExp(k+'\\s*=\\s*"([^"]*)"','i'))||s.match(new RegExp(k+"\\s*=\\s*'([^']*)'",'i'));return m?m[1]:''}async function go(){let f=document.querySelector('#f').files[0];if(!f)return r.textContent='اختر الملف أولًا';let t=await f.text(),o=[],p=null;for(let l of t.split(/\\r?\\n/)){l=l.trim();if(l.startsWith('#EXTINF:')){let z=l.lastIndexOf(',');p={name:a(l,'tvg-name')||(z>=0?l.slice(z+1):'قناة'),logo:a(l,'tvg-logo'),group:a(l,'group-title')||'بدون قسم'}}else if(p&&l&&!l.startsWith('#')){o.push(p);p=null}}let b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='channels.json';x.click();r.textContent='تم التحويل: '+o.length+' قناة'}</script>
